name: Origin Hut CI

on:
  push:
    branches:
      - main
      - "work/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origin-hut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  node-api:

    name: Node / API

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck

      - name: Build API
        run: npm run build:api


  python-data:

    name: Python / Data

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/data/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q services/data/src
          python -m compileall -q services/data/tests

      - name: Run Python tests
        run: |
          python -m unittest discover \
            -s services/data/tests \
            -p "test_*.py" \
            -v
